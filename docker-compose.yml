services:
        opal:
                image: obiba/opal:latest
                #image: obiba/opal:test
                ports:
                        - "8880:8080"
                links:
                        - mongo
                        - mysqldata
                        - mariadbdata
                        - postgresdata
                        - rock
                environment:
                        - OPAL_ADMINISTRATOR_PASSWORD=password
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_USER=root
                        - MONGO_PASSWORD=example
                        - MYSQLDATA_DATABASE=opal
                        - MYSQLDATA_HOST=mysqldata
                        - MYSQLDATA_USER=opal
                        - MYSQLDATA_PASSWORD=password
                        - MARIADBDATA_DATABASE=opal
                        - MARIADBDATA_HOST=mariadbdata
                        - MARIADBDATA_USER=opal
                        - MARIADBDATA_PASSWORD=password
                        - POSTGRESDATA_DATABASE=opal
                        - POSTGRESDATA_HOST=postgresdata
                        - POSTGRESDATA_USER=opal
                        - POSTGRESDATA_PASSWORD=password
                        - ROCK_HOSTS=rock:8085
                        # OpenTelemetry: one variable turns on the log export, the DataSHIELD
                        # session traces and the DataSHIELD metrics. Uncomment it, and the
                        # otel-collector service below, to see them. Plain http is fine here
                        # because the collector is on the compose network; anywhere else the
                        # stream carries R expressions and usernames and needs https.
                        #- OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
                        #- OTEL_SERVICE_NAME=opal
                        #- OTEL_METRIC_EXPORT_INTERVAL=5000
                volumes:
                        - /tmp/test-opal:/srv
        mongo:
                image: mongo
                environment:
                        - MONGO_INITDB_ROOT_USERNAME=root
                        - MONGO_INITDB_ROOT_PASSWORD=example
        mysqldata:
                image: mysql
                environment:
                        - MYSQL_DATABASE=opal
                        - MYSQL_ROOT_PASSWORD=password
                        - MYSQL_USER=opal
                        - MYSQL_PASSWORD=password
        mariadbdata:
                image: mariadb
                environment:
                        - MYSQL_DATABASE=opal
                        - MYSQL_ROOT_PASSWORD=password
                        - MYSQL_USER=opal
                        - MYSQL_PASSWORD=password
        postgresdata:
                image: postgres
                environment:
                        - POSTGRES_DB=opal
                        - POSTGRES_USER=opal
                        - POSTGRES_PASSWORD=password
        rock:
                image: obiba/rock:latest
                volumes:
                        - /tmp/rock:/srv
        # Prints every log record, span and metric Opal exports. Uncomment the OTEL_ variables on
        # the opal service above, and add otel-collector to its links, to send anything here.
        otel-collector:
                image: otel/opentelemetry-collector-contrib:0.140.0
                command: ["--config=/etc/otel/config.yaml"]
                volumes:
                        - ./otel-collector-config.yml:/etc/otel/config.yaml:ro
