services:
        opal:
                image: obiba/opal:latest
                #image: obiba/opal:test
                ports:
                        - "8880:8080"
                networks:
                        - opal
                environment:
                        - OPAL_ADMINISTRATOR_PASSWORD=password
                        - MONGO_HOST=mongo
                        - MONGO_PORT=27017
                        - MONGO_USER=root
                        - MONGO_PASSWORD=example
                        - MYSQLDATA_DATABASE=opal
                        - MYSQLDATA_HOST=mysqldata
                        - MYSQLDATA_USER=opal
                        - MYSQLDATA_PASSWORD=password
                        - MARIADBDATA_DATABASE=opal
                        - MARIADBDATA_HOST=mariadbdata
                        - MARIADBDATA_USER=opal
                        - MARIADBDATA_PASSWORD=password
                        - POSTGRESDATA_DATABASE=opal
                        - POSTGRESDATA_HOST=postgresdata
                        - POSTGRESDATA_USER=opal
                        - POSTGRESDATA_PASSWORD=password
                        - ROCK_HOSTS=rock:8085
                        # OpenTelemetry: this one variable turns on the DataSHIELD audit log
                        # export, the traces and the metrics. See them at http://localhost:3000
                        - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
                        - OTEL_SERVICE_NAME=opal
                        - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
                        # 60s by default, which is a long wait when trying things out
                        - OTEL_METRIC_EXPORT_INTERVAL=5000
                volumes:
                        - opal-home:/srv
        mongo:
                image: mongo
                networks:
                        - opal
                environment:
                        - MONGO_INITDB_ROOT_USERNAME=root
                        - MONGO_INITDB_ROOT_PASSWORD=example
                volumes:
                        - mongo-data:/data/db
        mysqldata:
                image: mysql
                networks:
                        - opal
                environment:
                        - MYSQL_DATABASE=opal
                        - MYSQL_ROOT_PASSWORD=password
                        - MYSQL_USER=opal
                        - MYSQL_PASSWORD=password
                volumes:
                        - mysql-data:/var/lib/mysql
        mariadbdata:
                image: mariadb
                networks:
                        - opal
                environment:
                        - MYSQL_DATABASE=opal
                        - MYSQL_ROOT_PASSWORD=password
                        - MYSQL_USER=opal
                        - MYSQL_PASSWORD=password
                volumes:
                        - mariadb-data:/var/lib/mysql
        postgresdata:
                image: postgres
                networks:
                        - opal
                environment:
                        - POSTGRES_DB=opal
                        - POSTGRES_USER=opal
                        - POSTGRES_PASSWORD=password
                volumes:
                        - postgres-data:/var/lib/postgresql
        rock:
                image: datashield/rock-base:latest
                networks:
                        - opal
                volumes:
                        - rock-home:/srv
        # Collects and displays what Opal exports: an OpenTelemetry collector feeding Loki (logs),
        # Tempo (traces) and Prometheus (metrics), with Grafana over all three.
        #
        #   http://localhost:3000  - admin / admin
        #
        #   Logs    Explore > Loki       {service_name="opal"}
        #                                {service_name="opal", scope_name="datashield.user"}
        #   Traces  Explore > Tempo      Search, service opal, span datashield.aggregate
        #   Metrics Explore > Prometheus datashield_operation_count_total
        #                                datashield_operation_duration_seconds_bucket
        #                                datashield_session_active
        #                                datashield_quota_rejection_total
        #
        # Nothing is persisted: everything is in the container and goes when it does.
        lgtm:
                image: grafana/otel-lgtm:0.11.10
                networks:
                        - opal
                ports:
                        - "3000:3000"

volumes:
        opal-home:
        mongo-data:
        mysql-data:
        mariadb-data:
        postgres-data:
        rock-home:

# One network of its own, so that these containers see each other and nothing else on the host.
# Service names resolve on it: mongo, mysqldata, mariadbdata, postgresdata, rock, lgtm.
networks:
        opal:
                name: opal